[functions.whatsapp-health]
enabled = true
# Called by pg_cron. Like the exam sweep it takes no instruction from its
# caller -- it inspects the gateway and reports -- so there is nothing an
# unauthorised caller could make it do, and no JWT is required.
verify_jwt = false
entrypoint = "./functions/whatsapp-health/index.ts"

[functions.whatsapp-admin-alert]
enabled = true
# Called by a table trigger through pg_net, which cannot hold a secret or sign
# a JWT. Safe to leave open because the caller names an *event*, never a
# message or a recipient: the text is composed here from the row, and the
# destination comes from ADMIN_WHATSAPP_JIDS. The worst an unauthorised caller
# achieves is making the school's own admins hear again about a payment that
# really was submitted -- and the gateway deduplicates that.
verify_jwt = false
entrypoint = "./functions/whatsapp-admin-alert/index.ts"

[functions.whatsapp-group-post]
enabled = true
# Called by a table trigger through pg_net, which cannot sign a JWT. Safe to
# leave open for the same reason as whatsapp-admin-alert: the caller names an
# announcement, never a message or a destination. It also re-checks every
# condition the trigger checked, so a replayed call cannot post something that
# has since been unpublished or already sent.
verify_jwt = false
entrypoint = "./functions/whatsapp-group-post/index.ts"

[functions.whatsapp-student-notify]
enabled = true
# Called by table triggers through pg_net, which cannot sign a JWT. Safe for
# the same reason as the other two senders: the caller names a row, never a
# message and never a recipient. The recipient is resolved from that row
# through whatsapp_target_for_student, which honours the opt-out.
verify_jwt = false
entrypoint = "./functions/whatsapp-student-notify/index.ts"

[functions.whatsapp-number-check]
enabled = true
# Called by pg_cron. Takes no instruction from its caller: it finds the broken
# numbers itself and can only ask their owners to correct them.
verify_jwt = false
entrypoint = "./functions/whatsapp-number-check/index.ts"

[functions.whatsapp-inbound]
enabled = true
# Called by the gateway, which cannot sign a JWT. It authenticates with the
# same shared secret that guards /send -- necessarily so: without it anyone who
# found the URL could put words into any student's mouth, including "stop".
verify_jwt = false
entrypoint = "./functions/whatsapp-inbound/index.ts"
